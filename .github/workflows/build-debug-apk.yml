name: Build Debug APK

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Lakukan clean build sebelum kompilasi'
        required: false
        type: boolean
        default: false
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-apk:
    name: Build & Package Debug APK
    runs-on: ubuntu-24.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 1

    - name: Fetch required submodules
      run: |
        git -c url."https://github.com/".insteadOf=git@github.com: \
          submodule update --init --depth 1 vendor/samba vendor/termlib

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Set up Rust toolchain
      uses: dtolnay/rust-toolchain@stable
      with:
        targets: aarch64-linux-android
        components: rustfmt, clippy

    - name: Locate Android NDK & Configure Cargo
      run: |
        # Dapatkan path NDK dari runner
        NDK_PATH="${ANDROID_NDK_LATEST_HOME:-${ANDROID_NDK_HOME:-}}"
        if [ -z "$NDK_PATH" ] || [ ! -d "$NDK_PATH" ]; then
          NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -n 1)
        fi
        echo "Using Android NDK: $NDK_PATH"
        echo "NDK_PATH=$NDK_PATH" >> $GITHUB_ENV

        # Sesuaikan path NDK pada konfigurasi Cargo
        sed -i "s|/home/o/Android/Sdk/ndk/[^/]*|$NDK_PATH|g" src/pr-cli/.cargo/config.toml
        sed -i "s|/home/o/Android/Sdk/ndk/[^/]*|$NDK_PATH|g" src/proot-integration-test/.cargo/config.toml

    - name: Build Integration Test Binary
      run: |
        cd src/proot-integration-test
        cargo build --target aarch64-linux-android --release

    - name: Build PRoot C Binaries
      run: |
        chmod +x scripts/*.sh
        ./scripts/build.sh --arch=arm64 --ndk-path="$NDK_PATH"

    - name: Download Static Busybox
      run: |
        bash scripts/download-busybox.sh

    - name: Build Rust CLI (pr-cli)
      run: |
        cd src/pr-cli
        cargo build --target aarch64-linux-android --release

    - name: Bundle Native Binaries to proot-engine jniLibs
      run: |
        DEST_DIR="android/proot-engine/src/main/jniLibs/arm64-v8a"
        mkdir -p "$DEST_DIR"

        cp -f build/out/arm64/proot "$DEST_DIR/libproot.so"
        cp -f build/out/arm64/loader "$DEST_DIR/libproot-loader.so"
        cp -f src/pr-cli/target/aarch64-linux-android/release/pr-cli "$DEST_DIR/libpr-cli.so"
        cp -f build/assets/arm64-v8a/busybox "$DEST_DIR/libbusybox.so"

        echo "=== Bundled Native Binaries ==="
        ls -lh "$DEST_DIR"
        sha256sum "$DEST_DIR"/*

    - name: Grant execute permission to Gradle wrapper
      run: |
        chmod +x android/gradlew

    - name: Build Android Debug APK
      run: |
        cd android
        if [ "${{ inputs.clean_build }}" = "true" ]; then
          ./gradlew clean
        fi
        ./gradlew assembleDebug --stacktrace

    - name: Generate APK Checksum and Info
      id: apk_info
      run: |
        APK_FILE=$(ls android/app/build/outputs/apk/debug/*.apk | head -n 1)
        APK_NAME=$(basename "$APK_FILE")
        APK_SIZE=$(du -h "$APK_FILE" | cut -f1)
        APK_SHA256=$(sha256sum "$APK_FILE" | awk '{print $1}')
        
        echo "apk_file=$APK_FILE" >> $GITHUB_OUTPUT
        echo "apk_name=$APK_NAME" >> $GITHUB_OUTPUT
        echo "apk_size=$APK_SIZE" >> $GITHUB_OUTPUT
        echo "apk_sha256=$APK_SHA256" >> $GITHUB_OUTPUT

        echo "### Build Succeeded! 🚀" >> $GITHUB_STEP_SUMMARY
        echo "- **APK Name**: \`$APK_NAME\`" >> $GITHUB_STEP_SUMMARY
        echo "- **File Size**: \`$APK_SIZE\`" >> $GITHUB_STEP_SUMMARY
        echo "- **SHA-256**: \`$APK_SHA256\`" >> $GITHUB_STEP_SUMMARY

    - name: Upload Debug APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: pr-app-debug-apk
        path: android/app/build/outputs/apk/debug/*.apk
        if-no-files-found: error
        retention-days: 30

    - name: Upload proot-engine AAR Artifact
      uses: actions/upload-artifact@v4
      with:
        name: proot-engine-aar
        path: android/proot-engine/build/outputs/aar/*-debug.aar
        if-no-files-found: warn
        retention-days: 30